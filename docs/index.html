<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proof Samurai — Documentation</title>
  <meta name="description" content="Proof Samurai documentation: dependently-typed proof assistant in Scala 3 brace syntax with a small trusted kernel and verified code extraction to Scala 3, TypeScript, and JavaScript." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <button id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
        <a class="brand" href="#en/home" id="brand-link">
          <img class="brand-icon" src="favicon.svg" alt="" width="22" height="22" />
          <span class="brand-name">Proof Samurai</span>
          <span class="brand-version">v0.1.0</span>
        </a>
      </div>

      <div class="header-search">
        <input id="doc-search" type="search" placeholder="Search documentation, tactics, error codes..." aria-label="Search documentation" />
      </div>

      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-btn active" data-lang="en" aria-pressed="true">English</button>
          <button class="lang-btn" data-lang="ja" aria-pressed="false">日本語</button>
        </div>
        <button id="theme-toggle" class="header-btn" aria-label="Toggle color theme">Dark</button>
        <a class="header-btn" href="https://github.com/kmizu/proof-samurai" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-meta">
        <div class="sidebar-meta-label" data-i18n="sidebarStudioLabel">Local Web IDE</div>
        <code class="sidebar-cmd">sbt "run studio"</code>
      </div>
    </aside>

    <div class="main-wrap">
      <main class="content">
        <!-- OVERVIEW PAGE -->
        <section id="page-home" class="page active">
          <div id="home-container"></div>
        </section>

        <!-- MARKDOWN ARTICLE PAGE -->
        <article id="page-markdown" class="page">
          <div class="article-layout">
            <div class="article-main">
              <div id="article-breadcrumb" class="breadcrumb"></div>
              <div id="markdown-container" class="markdown-body"></div>
              <nav id="chapter-nav" class="chapter-nav" aria-label="Chapter navigation"></nav>
            </div>
            <aside id="article-toc" class="toc" aria-label="On this page"></aside>
          </div>
        </article>

        <!-- TACTIC & ERROR INDEX PAGE -->
        <section id="page-index" class="page">
          <div id="index-header"></div>
          <div class="index-controls">
            <input id="index-filter" class="filter-input" type="search" placeholder="Filter by tactic, goal shape, or error code (e.g. arith, cases, K020)..." />
            <div class="filter-tabs" id="index-kind-tabs"></div>
          </div>
          <div id="index-table-wrap"></div>
        </section>

        <!-- SEARCH RESULTS PAGE -->
        <section id="page-search" class="page">
          <h1 id="search-heading">Search Results</h1>
          <div id="search-results"></div>
        </section>

        <footer class="site-footer" id="site-footer"></footer>
      </main>
    </div>
  </div>

  <script src="assets/site.js"></script>
</body>
</html>
